name: CI
on: [push, pull_request]

jobs:
  test:
    strategy:
      matrix:
        node: ["22.18", "24"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 履歴を読む道具なので、浅いクローンでは自分を検査できない
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node test/run.ts
      - name: npm に出す形（コンパイル済み）でも動くこと
        run: |
          npm install --silent
          npm pack --silent
          tmp=$(mktemp -d); cd "$tmp"
          npm init -y > /dev/null
          npm install --silent "$GITHUB_WORKSPACE"/quintetkit-sharedfiles-*.tgz
          npx sharedfiles --help > /dev/null
      - name: 既定では落ちないこと
        run: |
          node src/cli.ts . > /dev/null
      - name: --max を超えたら 1 で終わること
        run: |
          set +e
          node src/cli.ts . --max 0 > /dev/null
          code=$?
          set -e
          [ "$code" = "1" ] || { echo "終了コードが ${code}（1 のはず）"; exit 1; }

  self-check:
    # 自分自身の履歴を自分で読む。動かないものは出さない
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: "24" }
      - run: node src/cli.ts . --format github

  action:
    # **composite action として、宣言している最低バージョンでも呼べるか。**
    # 新しい Node だけで通しても「22.18 以降」という主張は検証されない
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["22.18", "25"]
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v5
        with: { node-version: "${{ matrix.node }}" }
      - uses: ./
        with:
          path: .
          limit: "5"

  action-old-node:
    # **古い Node で呼ばれたとき、何が起きるかを固定する。**
    #
    # この action は src/cli.ts をそのまま node に渡すので、型ストリップが
    # 既定で有効でない Node だと ERR_UNKNOWN_FILE_EXTENSION で落ちる。
    # その文言は Node のバージョンに一言も触れない。
    #
    # 落ちること自体は正しい。**理由が伝わることを確かめる。**
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v5
        with: { node-version: '20' }
      - id: run
        continue-on-error: true
        uses: ./
        with:
          path: .
          limit: "5"
      - shell: bash
        run: |
          note="$RUNNER_TEMP/sharedfiles-node-unsupported"
          if [ "${{ steps.run.outcome }}" != "failure" ]; then
            echo "Node 20 で通ってしまった。ガードが効いていない"
            exit 1
          fi
          # **「落ちた」だけでは足りない。** ガードが出した失敗なのか、
          # 素の ERR_UNKNOWN_FILE_EXTENSION なのかを区別する
          if [ ! -f "$note" ]; then
            echo "落ちたが、バージョン確認のステップが出した失敗ではない"
            exit 1
          fi
          echo "Node $(cat "$note") をバージョン確認で拒否した（期待どおり）"
